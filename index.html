document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.12em;cursor:pointer\" style-hover=\"background:#B15C62\">{{ submitLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeSettings }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(70,35,38,0.24);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease both\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:440px;background:#FFFFFF;border-radius:22px;box-shadow:0 30px 70px rgba(90,40,44,0.22);padding:28px 28px 24px;animation:popIn .25s ease both\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:22px\">\n          <h3 style=\"margin:0;font-family:'Playfair Display',serif;font-weight:500;font-size:28px;color:#1F1A1A\">Settings<\u002Fh3>\n          <button type=\"button\" sc-camel-on-click=\"{{ closeSettings }}\" title=\"Close\" style=\"width:36px;height:36px;border-radius:50%;border:1px solid #F1D3D2;background:#FFFFFF;color:#9A6B6E;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:#FBE6E4\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" style=\"stroke-width:2;stroke-linecap:round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:0.16em;color:#9A6B6E\">CURRENCY\n            <sc-raw-select value=\"{{ currencyCode }}\" sc-camel-on-change=\"{{ setCurrency }}\" style=\"height:44px;padding:0 12px;border:1px solid #EED3D2;border-radius:12px;background:#FFFFFF;font-family:'Jost',sans-serif;font-size:14px;letter-spacing:0;color:#1F1A1A\">\n              <sc-for list=\"{{ currencies }}\" as=\"c\" hint-placeholder-count=\"8\">\n                <option value=\"{{ c.code }}\">{{ c.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <span style=\"font-size:11.5px;letter-spacing:0.02em;font-weight:400;color:#A88E90\">Changes the symbol only. Amounts are not converted.<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"display:flex;flex-direction:column;gap:7px;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:0.16em;color:#9A6B6E\">DATE FORMAT\n            <div style=\"display:flex;gap:6px;padding:4px;border:1px solid #EED3D2;border-radius:12px\">\n              <sc-for list=\"{{ dateFormats }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ d.onClick }}\" style=\"flex:1;height:36px;border:none;border-radius:9px;background:{{ d.bg }};color:{{ d.fg }};font-family:'Jost',sans-serif;font-size:13px;letter-spacing:0.02em;cursor:pointer\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-family:'Jost',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:0.16em;color:#9A6B6E\">DEFAULT PAYMENT TERMS (DAYS)\n            <input type=\"number\" min=\"0\" max=\"365\" value=\"{{ termDays }}\" sc-camel-on-change=\"{{ setTerms }}\" style=\"height:44px;padding:0 14px;border:1px solid #EED3D2;border-radius:12px;background:#FFFFFF;font-family:'Playfair Display',serif;font-size:16px;letter-spacing:0;color:#1F1A1A;outline:none\" style-focus=\"border-color:#C26D72;box-shadow:0 0 0 3px rgba(194,109,114,0.15)\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:flex-end;margin-top:24px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ closeSettings }}\" style=\"height:44px;padding:0 26px;border:none;border-radius:999px;background:#C26D72;color:#FFFFFF;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.12em;cursor:pointer\" style-hover=\"background:#B15C62\">DONE<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ confirmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ cancelConfirm }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(70,35,38,0.24);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease both\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:400px;background:#FFFFFF;border-radius:22px;box-shadow:0 30px 70px rgba(90,40,44,0.22);padding:28px 28px 24px;text-align:center;animation:popIn .25s ease both\">\n        <h3 style=\"margin:0;font-family:'Playfair Display',serif;font-weight:500;font-size:24px;color:#1F1A1A\">{{ confirmTitle }}<\u002Fh3>\n        <p style=\"margin:10px 0 22px;font-family:'Playfair Display',serif;font-size:15px;line-height:1.55;color:#6E5A5C;text-wrap:pretty\">{{ confirmText }}<\u002Fp>\n        <div style=\"display:flex;justify-content:center;gap:10px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ cancelConfirm }}\" style=\"height:44px;padding:0 20px;border:1px solid #EBCBCA;border-radius:999px;background:#FFFFFF;color:#8C5257;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:#FBE6E4\">Cancel<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ runConfirm }}\" style=\"height:44px;padding:0 22px;border:none;border-radius:999px;background:#C0313D;color:#FFFFFF;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer\" style-hover=\"background:#A82A35\">{{ confirmLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;padding:12px 20px;border-radius:999px;background:#1F1A1A;color:#FFFFFF;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:0.04em;animation:popIn .25s ease both;white-space:nowrap\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultCurrency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;USD&quot;,&quot;EUR&quot;,&quot;GBP&quot;,&quot;CAD&quot;,&quot;AUD&quot;,&quot;NZD&quot;,&quot;CHF&quot;,&quot;JPY&quot;,&quot;INR&quot;,&quot;ZAR&quot;],&quot;default&quot;:&quot;USD&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Defaults&quot;},&quot;dueDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:120,&quot;unit&quot;:&quot;days&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Defaults&quot;},&quot;firstRunSample&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Defaults&quot;}}\">\nconst KEY = 'invoice-tracker-v1';\nconst SKEY = 'invoice-tracker-settings';\nconst pad = n => String(n).padStart(2, '0');\nconst isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());\nconst toDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };\nconst addDays = (iso, n) => { const d = toDate(iso); d.setDate(d.getDate() + n); return isoOf(d); };\nconst isISO = s => typeof s === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(s);\nconst dayDiff = (a, b) => Math.round((toDate(a) - toDate(b)) / 86400000);\nconst CURRENCIES = [\n  ['USD', 'US Dollar ($)', 'en-US'], ['EUR', 'Euro (€)', 'en-IE'], ['GBP', 'British Pound (£)', 'en-GB'],\n  ['CAD', 'Canadian Dollar (CA$)', 'en-CA'], ['AUD', 'Australian Dollar (A$)', 'en-AU'], ['NZD', 'New Zealand Dollar (NZ$)', 'en-NZ'],\n  ['CHF', 'Swiss Franc (CHF)', 'de-CH'], ['JPY', 'Japanese Yen (¥)', 'ja-JP'], ['INR', 'Indian Rupee (₹)', 'en-IN'], ['ZAR', 'South African Rand (R)', 'en-ZA']\n];\nconst DATE_FORMATS = ['MM/DD/YYYY', 'DD/MM/YYYY', 'YYYY-MM-DD'];\nconst PALETTE = [['#FBE3E1', '#B65D63'], ['#E6EEE2', '#4E7A52'], ['#FDEEDB', '#B9691F'], ['#EEE5F3', '#7E5A93'], ['#E2ECF2', '#4D7489'], ['#F7E3EA', '#A3506E'], ['#F2EBDD', '#8A6D3B']];\nconst hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };\nconst initials = name => {\n  const w = name.replace(/\\b(the|l|d)['’ ]/gi, '').split(/[^A-Za-zÀ-ÿ0-9]+/).filter(Boolean);\n  if (!w.length) return '?';\n  return (w[0][0] + (w[1] ? w[1][0] : (w[0][1] || ''))).toUpperCase();\n};\nconst STATUS = {\n  paid: { label: 'Paid', bg: '#DDEFD9', fg: '#3E7A3A', dot: '#5E9A59' },\n  pending: { label: 'Pending', bg: '#FDEBD3', fg: '#C9711E', dot: '#E0954C' },\n  late: { label: 'Overdue', bg: '#FAD3D6', fg: '#C0313D', dot: '#D2525C' }\n};\nconst SAMPLE = [\n  ['INV-001', 'Studio Bloom', '2026-09-01', '2026-09-15', 1200, '2026-09-14', ''],\n  ['INV-002', 'Luna Beauty', '2026-09-05', '2026-09-20', 850, '2026-09-22', ''],\n  ['INV-003', 'Maison Ayna', '2026-09-10', '2026-09-25', 950, '', ''],\n  ['INV-004', 'Cozy Home', '2026-09-12', '2026-09-22', 1500, '', 'Reminder sent'],\n  ['INV-005', 'Atelier Noura', '2026-09-15', '2026-09-30', 750, '', ''],\n  ['INV-006', 'Pure Design', '2026-09-18', '2026-09-28', 1300, '2026-09-28', ''],\n  ['INV-007', 'Studio Eclat', '2026-09-20', '2026-10-05', 600, '', 'Send reminder'],\n  ['INV-008', 'Belle & Co', '2026-09-22', '2026-10-06', 1100, '', ''],\n  ['INV-009', 'Slow Living', '2026-09-25', '2026-10-10', 900, '', ''],\n  ['INV-010', 'Maison Sienna', '2026-09-28', '2026-10-08', 800, '', ''],\n  ['INV-011', 'Atelier Jade', '2026-10-01', '2026-10-12', 1400, '', ''],\n  ['INV-012', 'The Rose Studio', '2026-10-03', '2026-10-13', 380, '', '']\n];\nconst uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);\nconst makeSample = () => SAMPLE.map(r => ({ id: uid(), num: r[0], client: r[1], emission: r[2], echeance: r[3], montant: r[4], paiement: r[5], notes: r[6] }));\nconst plural = n => n + (n === 1 ? ' invoice' : ' invoices');\n\nclass Component extends DCLogic {\n  state = {\n    invoices: [], today: isoOf(new Date()), query: '', filter: 'all', filterOpen: false, moreOpen: false,\n    sortKey: 'num', sortDir: 1, modal: null, confirm: null, settingsOpen: false, toast: '',\n    settings: { currency: this.props.defaultCurrency ?? 'USD', dateFormat: 'MM/DD/YYYY', terms: this.props.dueDays ?? 30 },\n    narrow: typeof window !== 'undefined' && window.innerWidth < 860\n  };\n  fileRef = React.createRef();\n\n  componentDidMount() {\n    let inv = null, st = null;\n    try { const raw = localStorage.getItem(KEY); if (raw != null) inv = JSON.parse(raw); } catch (e) {}\n    try { st = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) {}\n    if (!Array.isArray(inv)) {\n      inv = (this.props.firstRunSample ?? true) ? makeSample() : [];\n      try { localStorage.setItem(KEY, JSON.stringify(inv)); } catch (e) {}\n    }\n    this.setState(s => ({ invoices: inv, settings: st ? { ...s.settings, ...st } : s.settings }));\n    this.onResize = () => { const n = window.innerWidth < 860; if (n !== this.state.narrow) this.setState({ narrow: n }); };\n    window.addEventListener('resize', this.onResize);\n    this.tick = setInterval(() => { const t = isoOf(new Date()); if (t !== this.state.today) this.setState({ today: t }); }, 30000);\n    this.onKey = e => { if (e.key === 'Escape') this.setState({ modal: null, confirm: null, filterOpen: false, moreOpen: false, settingsOpen: false }); };\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('keydown', this.onKey);\n    clearInterval(this.tick); clearTimeout(this.tt);\n  }\n\n  cur() { return CURRENCIES.find(c => c[0] === this.state.settings.currency) || CURRENCIES[0]; }\n  money(n) {\n    const [code, , loc] = this.cur();\n    const whole = Math.round(n * 100) % 100 === 0;\n    try { return new Intl.NumberFormat(loc, { style: 'currency', currency: code, minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }).format(n || 0); }\n    catch (e) { return code + ' ' + (n || 0); }\n  }\n  fmtDate(iso) {\n    if (!iso) return '';\n    const [y, m, d] = iso.split('-'), f = this.state.settings.dateFormat;\n    return f === 'DD/MM/YYYY' ? `${d}/${m}/${y}` : f === 'YYYY-MM-DD' ? iso : `${m}/${d}/${y}`;\n  }\n  saveSettings(patch) {\n    const settings = { ...this.state.settings, ...patch };\n    this.setState({ settings });\n    try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) {}\n  }\n  persist(invoices, msg) {\n    this.setState({ invoices });\n    try { localStorage.setItem(KEY, JSON.stringify(invoices)); } catch (e) {}\n    if (msg) this.flash(msg);\n  }\n  flash(msg) { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  statusOf(inv) {\n    if (inv.paiement) return 'paid';\n    return inv.echeance && dayDiff(this.state.today, inv.echeance) > 0 ? 'late' : 'pending';\n  }\n  nextNum() {\n    let m = 0, prefix = 'INV-';\n    this.state.invoices.forEach(i => { const k = /^(.*?)(\\d+)\\s*$/.exec(i.num || ''); if (k && +k[2] >= m) { m = +k[2]; prefix = k[1] || prefix; } });\n    return prefix + String(m + 1).padStart(3, '0');\n  }\n  blankForm(extra) {\n    const t = this.state.today;\n    return { num: this.nextNum(), client: '', emission: t, echeance: addDays(t, +this.state.settings.terms || 0), montant: '', paiement: '', notes: '', ...extra };\n  }\n  openNew = () => this.setState({ filterOpen: false, moreOpen: false, modal: { mode: 'new', error: '', form: this.blankForm() } });\n  openEdit(inv) {\n    this.setState({ modal: { mode: 'edit', id: inv.id, error: '', form: { num: inv.num, client: inv.client, emission: inv.emission, echeance: inv.echeance, montant: String(inv.montant), paiement: inv.paiement || '', notes: inv.notes || '' } } });\n  }\n  duplicate = () => {\n    const f = this.state.modal.form;\n    this.setState({ modal: { mode: 'new', error: '', form: this.blankForm({ client: f.client, montant: f.montant, notes: f.notes }) } });\n  };\n  setField(f) {\n    return e => { const v = e.target.value; this.setState(s => {\n      const form = { ...s.modal.form, [f]: v };\n      if (f === 'emission' && s.modal.mode === 'new' && isISO(v)) form.echeance = addDays(v, +s.settings.terms || 0);\n      return { modal: { ...s.modal, error: '', form } };\n    }); };\n  }\n  submit = e => {\n    if (e && e.preventDefault) e.preventDefault();\n    const { modal, invoices } = this.state;\n    const f = modal.form;\n    const fail = msg => this.setState({ modal: { ...modal, error: msg } });\n    let raw = String(f.montant).replace(/[^\\d.,-]/g, '');\n    if (raw.includes(',') && !raw.includes('.')) raw = raw.replace(',', '.'); else raw = raw.replace(/,/g, '');\n    const montant = parseFloat(raw);\n    if (!f.num.trim()) return fail('Please enter an invoice number.');\n    if (invoices.some(i => i.num.trim().toLowerCase() === f.num.trim().toLowerCase() && i.id !== modal.id)) return fail('This invoice number already exists.');\n    if (!f.client.trim()) return fail('Please enter a client name.');\n    if (!isISO(f.emission) || !isISO(f.echeance)) return fail('Please set the issue and due dates.');\n    if (isNaN(montant) || montant < 0) return fail('Please enter a valid amount.');\n    const data = { num: f.num.trim(), client: f.client.trim(), emission: f.emission, echeance: f.echeance, montant: Math.round(montant * 100) / 100, paiement: isISO(f.paiement) ? f.paiement : '', notes: f.notes.trim() };\n    const list = modal.mode === 'edit' ? invoices.map(i => i.id === modal.id ? { ...i, ...data } : i) : [...invoices, { id: uid(), ...data }];\n    this.setState({ modal: null });\n    this.persist(list, modal.mode === 'edit' ? 'Invoice updated' : 'Invoice added');\n  };\n  askDelete(inv) {\n    this.setState({ confirm: { title: 'Delete this invoice?', text: `Invoice ${inv.num} for ${inv.client} will be permanently deleted.`, label: 'Delete', run: () => this.persist(this.state.invoices.filter(i => i.id !== inv.id), 'Invoice deleted') } });\n  }\n  markPaid(inv) {\n    this.persist(this.state.invoices.map(i => i.id === inv.id ? { ...i, paiement: this.state.today } : i), `${inv.num} marked as paid`);\n  }\n  loadSample = () => {\n    const go = () => this.persist(makeSample(), 'Sample loaded');\n    this.setState({ moreOpen: false });\n    if (this.state.invoices.length) this.setState({ confirm: { title: 'Load the sample?', text: 'Your current invoices will be replaced by 12 sample invoices. Back up first if you want to keep them.', label: 'Replace', run: go } });\n    else go();\n  };\n  clearAll = () => this.setState({ moreOpen: false, confirm: { title: 'Delete everything?', text: 'All invoices will be removed from this browser. This cannot be undone.', label: 'Delete all', run: () => this.persist([], 'All invoices deleted') } });\n  download(name, content, type) {\n    const b = new Blob([content], { type });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(b); a.download = name;\n    document.body.appendChild(a); a.click();\n    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);\n  }\n  exportCSV = () => {\n    const q = v => '\"' + String(v ?? '').replace(/\"/g, '\"\"') + '\"';\n    const code = this.cur()[0];\n    const lines = [['Invoice #', 'Client', 'Issue date', 'Due date', `Amount (${code})`, 'Payment date', 'Status', 'Days overdue', 'Notes'].map(q).join(',')];\n    this.state.invoices.forEach(inv => {\n      const st = this.statusOf(inv);\n      lines.push([inv.num, inv.client, this.fmtDate(inv.emission), this.fmtDate(inv.echeance), inv.montant, this.fmtDate(inv.paiement), STATUS[st].label, st === 'late' ? dayDiff(this.state.today, inv.echeance) : 0, inv.notes].map(q).join(','));\n    });\n    this.download(`invoices-${this.state.today}.csv`, '\\ufeff' + lines.join('\\r\\n'), 'text/csv;charset=utf-8');\n    this.setState({ moreOpen: false });\n    this.flash('CSV downloaded');\n  };\n  backup = () => {\n    this.download(`invoices-backup-${this.state.today}.json`, JSON.stringify({ app: 'invoice-tracker', version: 2, date: this.state.today, settings: this.state.settings, invoices: this.state.invoices }, null, 2), 'application/json');\n    this.setState({ moreOpen: false });\n    this.flash('Backup downloaded');\n  };\n  restore = () => { this.setState({ moreOpen: false }); if (this.fileRef.current) this.fileRef.current.click(); };\n  onFile = e => {\n    const input = e.target, file = input.files && input.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      try {\n        const d = JSON.parse(reader.result);\n        const arr = Array.isArray(d) ? d : d.invoices;\n        if (!Array.isArray(arr)) throw new Error();\n        const list = arr.filter(i => i && i.num && i.client).map(i => ({\n          id: i.id || uid(), num: String(i.num), client: String(i.client),\n          emission: isISO(i.emission) ? i.emission : this.state.today, echeance: isISO(i.echeance) ? i.echeance : this.state.today,\n          montant: +i.montant || 0, paiement: isISO(i.paiement) ? i.paiement : '', notes: i.notes ? String(i.notes) : ''\n        }));\n        if (d.settings) this.saveSettings(d.settings);\n        this.persist(list, `Backup restored · ${plural(list.length)}`);\n      } catch (err) { this.flash('Invalid backup file'); }\n      input.value = '';\n    };\n    reader.readAsText(file);\n  };\n  setSort(key) { this.setState(s => s.sortKey === key ? { sortDir: -s.sortDir } : { sortKey: key, sortDir: 1 }); }\n\n  renderVals() {\n    const { invoices, query, filter, sortKey, sortDir, today, modal, confirm, narrow, settings } = this.state;\n    const [code] = this.cur();\n    const all = invoices.map(inv => { const st = this.statusOf(inv); return { inv, st, retard: st === 'late' ? dayDiff(today, inv.echeance) : 0 }; });\n    const sum = k => all.filter(e => !k || e.st === k).reduce((a, e) => a + (+e.inv.montant || 0), 0);\n    const cnt = k => all.filter(e => !k || e.st === k).length;\n    const q = query.trim().toLowerCase();\n    const list = all.filter(e => (filter === 'all' || e.st === filter) && (!q || e.inv.client.toLowerCase().includes(q) || e.inv.num.toLowerCase().includes(q)));\n    const ord = { late: 0, pending: 1, paid: 2 };\n    const val = e => sortKey === 'montant' ? +e.inv.montant : sortKey === 'retard' ? e.retard : sortKey === 'statut' ? ord[e.st] : String(e.inv[sortKey] || '');\n    list.sort((a, b) => {\n      const x = val(a), y = val(b);\n      if (typeof x === 'number') return (x - y) * sortDir;\n      if (!x && y) return 1; if (x && !y) return -1;\n      return x.localeCompare(y, 'en', { numeric: true, sensitivity: 'base' }) * sortDir;\n    });\n    const rows = list.map((e, i) => {\n      const s = STATUS[e.st], [avBg, avFg] = PALETTE[hash(e.inv.client.toLowerCase()) % PALETTE.length];\n      const pd = this.fmtDate(e.inv.paiement);\n      return {\n        id: e.inv.id, key: e.inv.id, num: e.inv.num, client: e.inv.client, initials: initials(e.inv.client), avBg, avFg,\n        emission: this.fmtDate(e.inv.emission), echeance: this.fmtDate(e.inv.echeance), montant: this.money(e.inv.montant),\n        paiement: pd, paiementOrDash: pd || '—', status: s.label, pillBg: s.bg, pillFg: s.fg,\n        retard: e.retard, retardColor: e.retard > 0 ? '#C0313D' : '#2E2526',\n        notes: e.inv.notes, notesOrDash: e.inv.notes || '—', canPay: e.st !== 'paid', delay: Math.min(i, 14) * 28 + 'ms',\n        onPay: () => this.markPaid(e.inv), onEdit: () => this.openEdit(e.inv), onDelete: () => this.askDelete(e.inv)\n      };\n    });\n    const cols = [['num', 'Invoice #'], ['client', 'Client'], ['emission', 'Issue date'], ['echeance', 'Due date'], ['montant', `Amount (${code})`], ['paiement', 'Payment date'], ['statut', 'Status'], ['retard', 'Days overdue'], ['notes', 'Notes']];\n    const sortOptions = cols.map(([key, plain]) => ({ key, plain }));\n    const headers = cols.map(([key, label]) => ({\n      key, label: label.toUpperCase(), justify: key === 'client' || key === 'notes' ? 'flex-start' : 'center',\n      arrow: sortKey === key ? (sortDir > 0 ? '▲' : '▼') : '▼', op: sortKey === key ? 1 : 0.3, onClick: () => this.setSort(key)\n    }));\n    headers.push({ key: '_a', label: '', justify: 'center', arrow: '', op: 0, onClick: () => {} });\n    const filterOptions = [['all', 'All', '#C9A7A9'], ['paid', 'Paid'], ['pending', 'Pending'], ['late', 'Overdue']].map(([k, label, dot]) => ({\n      label, count: k === 'all' ? cnt() : cnt(k), dot: dot || STATUS[k].dot, bg: filter === k ? '#FBE6E4' : 'transparent',\n      onClick: () => this.setState({ filter: k, filterOpen: false })\n    }));\n    const moreItems = [\n      { label: 'Export to CSV', onClick: this.exportCSV, color: '#1F1A1A' },\n      { label: 'Back up (JSON file)', onClick: this.backup, color: '#1F1A1A' },\n      { label: 'Restore from backup', onClick: this.restore, color: '#1F1A1A' },\n      { label: 'Load sample', onClick: this.loadSample, color: '#1F1A1A' },\n      ...(invoices.length ? [{ label: 'Delete all invoices', onClick: this.clearAll, color: '#C0313D' }] : [])\n    ];\n    let preview = STATUS.pending;\n    if (modal) { const f = modal.form; preview = f.paiement ? STATUS.paid : (isISO(f.echeance) && dayDiff(today, f.echeance) > 0 ? STATUS.late : STATUS.pending); }\n    const hasInvoices = invoices.length > 0;\n    const longLoc = settings.dateFormat === 'MM/DD/YYYY' ? 'en-US' : 'en-GB';\n    return {\n      todayLong: toDate(today).toLocaleDateString(longLoc, { day: 'numeric', month: 'long', year: 'numeric' }),\n      totals: { all: this.money(sum()), paid: this.money(sum('paid')), pending: this.money(sum('pending')), late: this.money(sum('late')) },\n      counts: { all: plural(cnt()), paid: plural(cnt('paid')), pending: plural(cnt('pending')), late: plural(cnt('late')) },\n      isEmpty: !hasInvoices, showTable: hasInvoices && !narrow, showCards: hasInvoices && narrow,\n      noMatch: hasInvoices && rows.length === 0, rows, headers, sortOptions,\n      listCount: hasInvoices ? (rows.length === invoices.length ? plural(rows.length) : `${rows.length} of ${invoices.length}`) : '',\n      query, onQuery: e => this.setState({ query: e.target.value }),\n      filterOpen: this.state.filterOpen, moreOpen: this.state.moreOpen, menuOpen: this.state.filterOpen || this.state.moreOpen,\n      toggleFilter: () => this.setState(s => ({ filterOpen: !s.filterOpen, moreOpen: false })),\n      toggleMore: () => this.setState(s => ({ moreOpen: !s.moreOpen, filterOpen: false })),\n      closeMenus: () => this.setState({ filterOpen: false, moreOpen: false }),\n      filterOptions, moreItems, filterBtnBg: filter !== 'all' ? '#F6CFCF' : '#FFFFFF',\n      activeFilterLabel: filter !== 'all' ? STATUS[filter].label : '', clearFilter: () => this.setState({ filter: 'all' }),\n      sortKey, sortArrow: sortDir > 0 ? '▲' : '▼', onSortSelect: e => this.setState({ sortKey: e.target.value }), flipSort: () => this.setState(s => ({ sortDir: -s.sortDir })),\n      openNew: this.openNew, loadSample: this.loadSample, fileRef: this.fileRef, onFile: this.onFile,\n      currencyCode: code, currencies: CURRENCIES.map(([c, label]) => ({ code: c, label })),\n      setCurrency: e => this.saveSettings({ currency: e.target.value }),\n      dateFormats: DATE_FORMATS.map(f => ({ label: f, bg: settings.dateFormat === f ? '#C26D72' : 'transparent', fg: settings.dateFormat === f ? '#FFFFFF' : '#4A3B3C', onClick: () => this.saveSettings({ dateFormat: f }) })),\n      termDays: settings.terms, setTerms: e => this.saveSettings({ terms: e.target.value === '' ? '' : Math.max(0, Math.min(365, parseInt(e.target.value, 10) || 0)) }),\n      settingsOpen: this.state.settingsOpen, openSettings: () => this.setState({ settingsOpen: true, filterOpen: false, moreOpen: false }), closeSettings: () => this.setState({ settingsOpen: false }),\n      modalOpen: !!modal, isEdit: !!modal && modal.mode === 'edit', form: modal ? modal.form : {}, modalError: modal ? modal.error : '',\n      modalTitle: modal && modal.mode === 'edit' ? 'Edit invoice' : 'New invoice',\n      submitLabel: modal && modal.mode === 'edit' ? 'SAVE' : 'ADD INVOICE', amountLabel: `AMOUNT (${code})`, duplicate: this.duplicate,\n      previewStatus: preview.label, previewBg: preview.bg, previewFg: preview.fg,\n      clientNames: [...new Set(invoices.map(i => i.client))].sort((a, b) => a.localeCompare(b)),\n      setNum: this.setField('num'), setClient: this.setField('client'), setEmission: this.setField('emission'), setEcheance: this.setField('echeance'),\n      setMontant: this.setField('montant'), setPaiement: this.setField('paiement'), setNotes: this.setField('notes'),\n      submit: this.submit, closeModal: () => this.setState({ modal: null }), stop: e => e.stopPropagation(),\n      confirmOpen: !!confirm, confirmTitle: confirm ? confirm.title : '', confirmText: confirm ? confirm.text : '', confirmLabel: confirm ? confirm.label : '',\n      cancelConfirm: () => this.setState({ confirm: null }),\n      runConfirm: () => { const c = this.state.confirm; this.setState({ confirm: null }); if (c) c.run(); },\n      toast: this.state.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
